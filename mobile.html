<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minix Trader Mobile</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#020b18"><style>
:root{--bg:#020b18;--card:#0a192b;--line:#1b3d5d;--cyan:#34d8ff;--green:#25e681;--red:#ff5c78;--yellow:#ffc72f;--muted:#8faac5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123b60,#020b18 32%);color:#eef7ff;font-family:Arial;padding-bottom:82px}.head{position:sticky;top:0;z-index:9;background:#041326ed;border-bottom:1px solid var(--line);padding:14px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:var(--cyan)}.brand small{display:block;font-size:9px;color:#b9cee3}.head a{color:white;text-decoration:none;font-size:20px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.filters select{background:#071525;color:white;border:1px solid var(--line);border-radius:11px;padding:11px;width:100%}.page{display:none;padding:0 12px 20px}.page.on{display:block}h2{color:var(--cyan);margin:8px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:linear-gradient(145deg,#0d2035,#071423);border:1px solid var(--line);border-radius:15px;padding:13px;min-width:0}.full{grid-column:1/-1}.lab{font-size:11px;color:var(--muted);font-weight:bold}.val{font-size:19px;font-weight:950;margin-top:6px;overflow-wrap:anywhere}.pos{color:var(--green)}.neg{color:var(--red)}.chg{color:var(--yellow)}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #17344f;font-size:12px}.row:last-child{border:0}.row b{text-align:right}.seg{border-left:4px solid}.cash{border-color:var(--yellow)}.fno{border-color:#3484ff}.mcx{border-color:#a855f7}.stack{display:grid;gap:8px}.detail{background:#081728;border:1px solid var(--line);border-radius:12px;padding:11px}.detail summary{font-weight:900;color:#c9eaff;cursor:pointer}.barbox{height:190px;display:flex;align-items:flex-end;gap:8px;padding:14px 5px 25px}.bar{flex:1;background:var(--green);height:var(--h);border-radius:5px 5px 0 0;position:relative}.bar.n{background:var(--red)}.bar span{position:absolute;bottom:-19px;font-size:9px;color:var(--muted);left:50%;transform:translateX(-50%)}.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menu button,.menu a{background:#0b1c30;border:1px solid var(--line);color:white;border-radius:14px;padding:14px;text-align:left;text-decoration:none;font-weight:900;min-height:74px}.menu span{display:block;color:var(--cyan);font-size:21px;margin-bottom:6px}.bottom{position:fixed;bottom:7px;left:7px;right:7px;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:#061528f2;border:1px solid var(--line);border-radius:17px;padding:6px}.bottom button{border:0;background:none;color:#9ab8d5;padding:5px 1px;font-size:9px;font-weight:bold}.bottom button.on{color:var(--cyan);background:#10304d;border-radius:9px}.bottom span{display:block;font-size:19px}.empty{text-align:center;color:var(--muted);padding:20px}
</style></head><body><header class="head"><button onclick="go('more')" style="background:none;border:0;color:white;font-size:20px">☰</button><div class="brand">MINIX<small>TRADER DASHBOARD</small></div><a href="admin.html">⬆</a></header><div class="filters"><select id="fy"></select><select id="co"></select><select id="tr"></select><select id="st"></select></div>
<main id="dash" class="page on"><h2>Mobile Dashboard</h2><div class="grid" id="kpis"></div><div class="card full" style="margin-top:9px"><b>Segment-wise P&amp;L</b><div id="segments"></div></div></main>
<main id="perf" class="page"><h2>Performance</h2><div class="stack" id="segmentCards"></div><h2>Weekly P&amp;L</h2><div class="card"><div class="barbox" id="bars"></div></div><h2>Monthly P&amp;L</h2><div class="stack" id="months"></div></main>
<main id="analytics" class="page"><h2>Trader Analytics</h2><div class="card"><b class="pos">Top Traders</b><div id="top"></div></div><div class="card" style="margin-top:9px"><b class="neg">Worst Traders</b><div id="worst"></div></div><h2>Accuracy / Win Ratio</h2><div class="stack" id="accuracy"></div></main>
<main id="reports" class="page"><h2>Charges &amp; MIS</h2><div class="stack" id="charges"></div><h2>Portfolio &amp; Dividend</h2><div class="stack" id="portfolio"></div></main>
<main id="more" class="page"><h2>All 20 Screens</h2><div class="menu"><button onclick="go('dash')"><span>⌂</span>1. Dashboard</button><button onclick="go('perf')"><span>▥</span>2–4. Performance</button><button onclick="go('market')"><span>⌁</span>5. NIFTY/BANK</button><button onclick="go('reports')"><span>₹</span>6–10. Charges</button><button onclick="go('analytics')"><span>♙</span>11–13. Analytics</button><button onclick="go('reports')"><span>▦</span>14–18. MIS/Capital</button><a href="admin.html"><span>⬆</span>19. Upload CSV</a><a href="admin.html"><span>⚙</span>20. Login/Settings</a><a class="full" href="dashboard.html?desktop=1"><span>▤</span>Detailed Desktop Dashboard</a></div></main>
<main id="market" class="page"><h2>NIFTY &amp; BANKNIFTY</h2><div class="grid" id="marketCards"></div></main>
<nav class="bottom"><button class="on" data-p="dash"><span>⌂</span>Dashboard</button><button data-p="perf"><span>▥</span>Performance</button><button data-p="analytics"><span>♙</span>Analytics</button><button data-p="reports"><span>▦</span>Reports</button><button data-p="more"><span>•••</span>More</button></nav>
<script>
let A=[],M=[],F=[];const q=x=>document.getElementById(x),n=x=>Number(String(x||0).replace(/[,₹%\s]/g,''))||0,m=x=>(n(x)<0?'-':'')+'₹'+Math.abs(n(x)).toLocaleString('en-IN',{maximumFractionDigits:0}),c=x=>n(x)>=0?'pos':'neg',sum=(a,k)=>a.reduce((s,r)=>s+n(r[k]),0),net=r=>n(r['FNO Net Amount'])+n(r['Cash Net Amount'])+n(r['MCX Net Amount']),gross=r=>n(r['FNO Gross'])+n(r['Cash Gross'])+n(r['MCX Gross']),chg=r=>n(r['FNO Gorv Chg'])+n(r['Cash Gorv Chg'])+n(r['MCX Gorv Chg']);
function dt(s){const a=String(s).split('-');return new Date(a[2]?.length===2?2000+n(a[2]):n(a[2]),'JanFebMarAprMayJunJulAugSepOctNovDec'.indexOf(a[1])/3,n(a[0]))}function opts(id,label,k){const v=[...new Set(A.map(r=>r[k]).filter(Boolean))];q(id).innerHTML=`<option value="">${label}: All</option>`+v.map(x=>`<option>${x}</option>`).join('');q(id).onchange=apply}function latestFund(a){const z={};a.forEach(r=>{const t=r['Trader Name'],d=dt(r.Date);if(!z[t]||d>z[t].d)z[t]={d,f:n(r.Fund),u:n(r['Margin Utilized'])}});return Object.values(z).reduce((s,x)=>({f:s.f+x.f,u:s.u+x.u}),{f:0,u:0})}function k(l,v,x=''){return`<div class="card"><div class="lab">${l}</div><div class="val ${x}">${v}</div></div>`}function row(l,v,x=''){return`<div class="row"><span>${l}</span><b class="${x}">${v}</b></div>`}
function apply(){const ks=['Financial Year','Company Name','Trader Name','Strategy'],ids=['fy','co','tr','st'];F=A.filter(r=>ids.every((x,i)=>!q(x).value||r[ks[i]]===q(x).value));render()}function render(){const f=latestFund(F),g=F.reduce((s,r)=>s+gross(r),0),x=F.reduce((s,r)=>s+chg(r),0),v=g-x;q('kpis').innerHTML=k('Total Fund',m(f.f))+k('Margin Utilized',m(f.u),'chg')+k('Gross P&L',m(g),c(g))+k('Expenses',m(x),'chg')+k('Net P&L',m(v),c(v))+k('ROI',(f.f?v/f.f*100:0).toFixed(2)+'%',c(v));q('segments').innerHTML=['Cash','FNO','MCX'].map(s=>row(s,m(sum(F,s+' Net Amount')),c(sum(F,s+' Net Amount')))).join('');q('segmentCards').innerHTML=['Cash','FNO','MCX'].map(s=>`<div class="card seg ${s.toLowerCase()}"><b>${s}</b>${row('Gross',m(sum(F,s+' Gross')),c(sum(F,s+' Gross')))}${row('Charges',m(sum(F,s+' Gorv Chg')),'chg')}${row('Net',m(sum(F,s+' Net Amount')),c(sum(F,s+' Net Amount')))}</div>`).join('');const wm={};F.forEach(r=>{const d=dt(r.Date),w='W'+Math.ceil(d.getDate()/7);wm[w]=(wm[w]||0)+net(r)});const wa=Object.entries(wm).slice(-5),mx=Math.max(1,...wa.map(x=>Math.abs(x[1])));q('bars').innerHTML=wa.map(x=>`<div class="bar ${x[1]<0?'n':''}" style="--h:${Math.max(8,Math.abs(x[1])/mx*145)}px"><span>${x[0]}</span></div>`).join('');const mm={};F.forEach(r=>mm[r.Month]=(mm[r.Month]||0)+net(r));q('months').innerHTML=Object.entries(mm).reverse().map(x=>`<div class="card">${row(x[0],m(x[1]),c(x[1]))}</div>`).join('');traders();report()}
function traders(){const z={};F.forEach(r=>{const t=r['Trader Name'],d=r.Date,a=z[t]||(z[t]={name:t,total:0,days:{}});a.total+=net(r);a.days[d]=(a.days[d]||0)+net(r)});const a=Object.values(z);a.forEach(x=>{const d=Object.values(x.days);x.w=d.filter(v=>v>0).length;x.l=d.filter(v=>v<0).length;x.rate=(x.w+x.l)?x.w/(x.w+x.l)*100:0});const rr=a=>a.map(x=>row(x.name,m(x.total),c(x.total))).join('');q('top').innerHTML=rr([...a].sort((x,y)=>y.total-x.total).slice(0,5));q('worst').innerHTML=rr([...a].sort((x,y)=>x.total-y.total).slice(0,5));q('accuracy').innerHTML=[...a].sort((x,y)=>y.rate-x.rate).map(x=>`<details class="detail"><summary>${x.name}<span style="float:right">${x.rate.toFixed(1)}%</span></summary>${row('Winning Days',x.w,'pos')}${row('Losing Days',x.l,'neg')}${row('Net P&L',m(x.total),c(x.total))}</details>`).join('')}
function report(){q('charges').innerHTML=['FNO','Cash','MCX'].map(s=>`<details class="detail"><summary>${s} Charges <span class="chg" style="float:right">${m(sum(F,s+' Gorv Chg'))}</span></summary>${['BRK','BRK On GST','Clearing Charges','Trx Chgs','Sebi Chgs','STT','Stamp Duty','IPF Charges','GST'].map(k=>row(k,m(sum(F,s+' '+k)))).join('')}</details>`).join('');const z={};F.forEach(r=>{const p=r['Portfolio Name'],a=z[p]||(z[p]={p,net:0,div:0,charge:0});a.net+=net(r);a.div+=n(r['Dividend Received']);a.charge+=chg(r)});q('portfolio').innerHTML=Object.values(z).map(x=>`<details class="detail"><summary>${x.p}<span class="${c(x.net)}" style="float:right">${m(x.net)}</span></summary>${row('Charges',m(x.charge),'chg')}${row('Dividend',m(x.div),'pos')}</details>`).join('')}
function renderMarket(){const z={};M.forEach(r=>{const d=String(r.Date).split('-').reverse().join('-'),x=z[r['Index Name']];if(!x||d>x.d)z[r['Index Name']]={d,r}});q('marketCards').innerHTML=Object.values(z).map(x=>{const r=x.r,v=n(r['Change(%)']);return`<div class="card"><div class="lab">${r['Index Name']}</div><div class="val ${c(v)}">${n(r['Closing Index Value']).toLocaleString('en-IN')}</div>${row('Change',v.toFixed(2)+'%',c(v))}${row('Open',r['Open Index Value'])}${row('High',r['High Index Value'])}${row('Low',r['Low Index Value'])}${row('P/E • P/B',r['P/E']+' • '+r['P/B'])}${row('Dividend Yield',r['Div Yield'])}</div>`}).join('')}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',x.dataset.p===id));scrollTo(0,0)}document.querySelectorAll('.bottom button').forEach(x=>x.onclick=()=>go(x.dataset.p));Promise.all([fetch('data/traders.json').then(r=>r.json()),fetch('data/nifty-banknifty.json').then(r=>r.json())]).then(x=>{A=x[0];M=x[1];opts('fy','FY','Financial Year');opts('co','Company','Company Name');opts('tr','Trader','Trader Name');opts('st','Strategy','Strategy');apply();renderMarket()});
</script></body></html>
