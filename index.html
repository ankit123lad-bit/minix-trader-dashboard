<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minix Trader Dashboard</title>
<meta name="theme-color" content="#0b1220"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Minix Trader">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>try{var t=localStorage.getItem('MX_THEME');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<script src="config.js"></script>
<style>
:root{--bg:#0b1220;--panel:#111a2b;--p2:#162238;--line:#22304a;--text:#e6edf7;--muted:#8ea0bd;--accent:#3b82f6;--gain:#22c07a;--loss:#ef5b6a;--glow:radial-gradient(circle at 30% 15%,#13264a,#0b1220 60%)}
html[data-theme=light]{--bg:#eef2f8;--panel:#ffffff;--p2:#f5f7fb;--line:#dbe3ee;--text:#111827;--muted:#64748b;--glow:radial-gradient(circle at 30% 15%,#dbe8ff,#eef2f8 60%)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--glow);background-color:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,Arial,sans-serif;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
.card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.top{display:flex;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--p2);color:var(--text);padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.logo{display:inline-block;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:6px 14px;margin-top:6px}.logo img{height:46px;display:block}
h1{font-size:22px;margin:14px 0 4px}.muted{color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:12px;font-weight:700;font-size:15px;color:#fff;text-decoration:none;background:var(--accent);box-shadow:0 4px 0 #1e4fa8;border:0;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1e4fa8}
.btn.t{background:#0f9f8f;box-shadow:0 4px 0 #0b6b61}.btn.v{background:#7c3aed;box-shadow:0 4px 0 #5521b5;display:inline-flex;padding:10px 18px;font-size:14px}
.pills{margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--p2);border:1px solid var(--line);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}.dot.ok{background:var(--gain)}.dot.bad{background:var(--loss)}
.info{font-size:13px;margin-top:10px}.info b{color:var(--text)}
.flow{font-size:12px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
#modeBox{margin-top:4px}
@media(max-width:520px){.acts{grid-template-columns:1fr}.card{padding:20px 16px}}
</style></head><body>

/* read small public notes kept by Admin Entry (no P&L numbers) */
async function readCfg(keys){
  if(lan&&mode==='lan'){var out={};await Promise.all(keys.map(async function(k){var r=await fetch('/api/query',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({table:'minix_trader_settings',action:'select',columns:'key,note',filters:[['eq','key',k]],order:null,limit:1})});var j=await r.json();(j.data||[]).forEach(function(x){try{out[x.key]=JSON.parse(x.note);}catch(e){}});}));return out;}
  var cfg=lan?ON:(C.supabaseUrl?C:ON),base=String(cfg.supabaseUrl).replace(/\/$/,'');
  var u=base+'/rest/v1/minix_trader_settings?select=key,note&key=in.'+encodeURIComponent('('+keys.map(function(k){return '"'+k+'"';}).join(',')+')');
  var r2=await fetch(u,{headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey}});var a=await r2.json();var o={};(a||[]).forEach(function(x){try{o[x.key]=JSON.parse(x.note);}catch(e){}});return o;}
(async function(){
  var p='',lanOk=null;
  if(lan){try{var r=await fetch('/api/data-version?_='+Date.now(),{cache:'no-store'});lanOk=r.ok;}catch(e){lanOk=false;}p+=pill('🖥 Office LAN',lanOk,lanOk?'online':'offline');}
  var info={};try{info=await readCfg(['Config|DATA_INFO','Config|ONLINE_COPY']);}catch(e){}
  var oc=info['Config|ONLINE_COPY'];p+=pill('🌐 Online copy',oc&&oc.at?true:null,oc&&oc.at?fmtTime(oc.at):'not copied yet');
  $('pills').innerHTML=p;
  var di=info['Config|DATA_INFO'];$('dataInfo').innerHTML=di&&di.last?'Data up to <b>'+fmtDate(di.last)+'</b> · '+Number(di.rows||0).toLocaleString('en-IN')+' rows':'Data date will show after the next upload';
})();
/* install app */
var dp=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;$('installBtn').hidden=false;});
var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent)){$('installHelp').hidden=false;$('installHelp').textContent='iPhone: Share → Add to Home Screen';}
$('installBtn').onclick=async function(){if(!dp)return;dp.prompt();try{await dp.userChoice;}catch(e){}dp=null;$('installBtn').hidden=true;};
if('serviceWorker' in navigator){navigator.serviceWorker.register('/service-worker.js').catch(function(){});}
})();
</script>
